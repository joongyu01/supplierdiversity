name: Watch enterprise certification changes
on:
  schedule:
    - cron: '23 23 * * *' # 08:23 Asia/Seoul; GitHub may delay scheduled runs.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cancellation.txt
      - run: python -m pip install -r requirements-cancellation.txt
      - run: python -m unittest discover -s tests -p test_cancellations.py -v
      - run: python -m unittest discover -s tests -p test_policy_changes.py -v
      - name: Read official notices
        run: python scripts/watch_cancellations.py
      - name: Read additional official certification boards
        run: python scripts/watch_policy_changes.py
      - name: Commit successful scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/cancellation-notices.json site/data/policy-notices.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: check enterprise certification notices'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare progressive offer delivery
        run: python scripts/build_offer_delivery.py
      - name: Version browser assets
        run: python scripts/version_site_assets.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
