name: Collect public offers
on:
  workflow_dispatch:
    inputs:
      sepp_pages:
        description: '가치장터 목록 페이지 수 (0 = 전체)'
        default: '0'
      goods_pages:
        description: '꿈드래 분류별 목록 페이지 수 (0 = 전체)'
        default: '0'
      goods_categories:
        description: '꿈드래 분류 (쉼표 구분, 비우면 12개 전체)'
        default: ''
      workers:
        description: '동시 요청 스레드 (요청 간격은 유지)'
        default: '24'
      refresh:
        description: '24시간 이내의 상세 캐시도 무시하고 원문 재조회'
        type: boolean
        default: false
      publish:
        description: '수집 결과를 커밋하고 배포'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect-offers
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # 상세 캐시는 24시간까지만 재사용. 목록은 실행마다 다시 확인합니다.
      - name: Restore response cache
        uses: actions/cache/restore@v4
        with:
          path: private/offer-cache
          key: offer-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: offer-cache-v2-
      - name: Collect public product pages
        id: collect
        timeout-minutes: 320
        env:
          PYTHONUNBUFFERED: '1'
          SEPP_PAGES: ${{ inputs.sepp_pages }}
          GOODS_PAGES: ${{ inputs.goods_pages }}
          GOODS_CATEGORIES: ${{ inputs.goods_categories }}
          WORKERS: ${{ inputs.workers }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          options=()
          if [ "$REFRESH" = "true" ]; then options+=(--refresh); fi
          python scripts/collect_offers.py \
            --sepp-pages "$SEPP_PAGES" \
            --goods-pages "$GOODS_PAGES" \
            --goods-categories "$GOODS_CATEGORIES" \
            --workers "$WORKERS" "${options[@]}"
      - name: Save response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: private/offer-cache
          key: offer-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build offers.json
        run: python scripts/build_offers_site.py
      - name: Collection report
        if: always()
        run: |
          if [ -f data/offers/collection-attempt.json ]; then python -c "import json;r=json.load(open('data/offers/collection-attempt.json',encoding='utf-8'));print(json.dumps({k:v for k,v in r.items() if k!='failures'},ensure_ascii=False,indent=2));print('failures',len(r['failures']))"; fi
      - name: Upload collection data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-${{ github.run_id }}
          path: |
            data/offers/*.json
            data/offers/*.jsonl
            site/data/offers.json
          if-no-files-found: ignore
      - name: Commit offers.json
        if: inputs.publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect public offers from SEPP and goods.go.kr'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: inputs.publish
      - name: Prepare progressive offer delivery
        run: python scripts/build_offer_delivery.py
      - name: Version browser assets
        run: python scripts/version_site_assets.py
      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: inputs.publish
