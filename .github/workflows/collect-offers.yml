name: Collect public offers
on:
  workflow_dispatch:
    inputs:
      sepp_pages:
        description: '가치장터 목록 페이지 수 (0 = 전체)'
        default: '0'
      goods_pages:
        description: '꿈드래 분류별 목록 페이지 수 (0 = 전체)'
        default: '0'
      goods_categories:
        description: '꿈드래 분류 (쉼표 구분, 비우면 12개 전체)'
        default: ''
      workers:
        description: '동시 요청 스레드 (요청 간격은 유지)'
        default: '24'
      publish:
        description: '수집 결과를 커밋하고 배포'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect-offers
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_offers.py -v
      # 응답 캐시: 시간 초과·실패 후 다시 실행하면 받은 페이지는 건너뜁니다.
      - name: Restore response cache
        uses: actions/cache/restore@v4
        with:
          path: private/offer-cache
          key: offer-cache-${{ github.run_id }}
          restore-keys: offer-cache-
      - name: Collect public product pages
        id: collect
        timeout-minutes: 320
        env:
          PYTHONUNBUFFERED: '1'
        run: >
          python scripts/collect_offers.py
          --sepp-pages '${{ inputs.sepp_pages }}'
          --goods-pages '${{ inputs.goods_pages }}'
          --goods-categories '${{ inputs.goods_categories }}'
          --workers '${{ inputs.workers }}'
      - name: Save response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: private/offer-cache
          key: offer-cache-${{ github.run_id }}
      - name: Build offers.json
        run: python scripts/build_offers_site.py
      - name: Collection report
        if: always()
        run: |
          if [ -f data/offers/join-report.json ]; then python -c "import json;r=json.load(open('data/offers/join-report.json',encoding='utf-8'));print(json.dumps({k:v for k,v in r.items() if k!='failures'},ensure_ascii=False,indent=2));print('failures',len(r['failures']))"; fi
      - name: Upload collection data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-${{ github.run_id }}
          path: |
            data/offers/*.json
            data/offers/*.jsonl
            site/data/offers.json
          if-no-files-found: ignore
      - name: Commit offers.json
        if: inputs.publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect public offers from SEPP and goods.go.kr'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: inputs.publish
      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: inputs.publish
